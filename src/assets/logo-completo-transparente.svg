<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 80" width="580" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9b3d6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <g transform="translate(14 8)" filter="url(#glow)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shine)"/>
    <polygon points="32,12 49,22 32,32 15,22" fill="#ffffff" fill-opacity="0.96"/>
    <polygon points="15,22 32,32 32,52 15,42" fill="#ffffff" fill-opacity="0.55"/>
    <polygon points="32,32 49,22 49,42 32,52" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="49" cy="14" r="3.2" fill="#ffffff"/>
    <circle cx="49" cy="14" r="5.5" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
  </g>
  <text x="92" y="52" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="url(#tx)">Inventario</text>
</svg>
